[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.2.0"
description = "OpenClaw: Decentralized LLM training -- The People's AI. Train the world's first truly open language model."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
full = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
openclaw = "openclaw_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
