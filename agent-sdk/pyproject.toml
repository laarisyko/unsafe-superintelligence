[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unsafesuperintelligence"
version = "0.1.0"
description = "USSI: Decentralized P2P LLM training & inference network -- join with one command"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ussi = "ussi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
